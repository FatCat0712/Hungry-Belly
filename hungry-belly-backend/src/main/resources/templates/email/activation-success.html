<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Account Activated — Hungry Belly</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
        body {
            min-height:100vh; background-color:#FDF6EE;
            font-family:'DM Sans',Arial,sans-serif;
            display:flex; align-items:center; justify-content:center; padding:24px;
        }
        .card {
            background:#FFFFFF; border-radius:24px;
            box-shadow:0 4px 48px rgba(0,0,0,0.08);
            max-width:480px; width:100%; overflow:hidden;
            animation:rise 0.5s cubic-bezier(0.22,1,0.36,1) both;
        }
        @keyframes rise {
            from { opacity:0; transform:translateY(24px); }
            to   { opacity:1; transform:translateY(0); }
        }
        .header {
            background-color:#1A1009;
            padding:28px 44px;
            display:flex; align-items:center; gap:14px;
        }
        .header img {
            width:52px; height:52px;
            border-radius:10px; display:block;
        }
        .logo-text {
            font-family:'Playfair Display',Georgia,serif;
            font-size:20px; color:#FFFFFF; letter-spacing:-0.2px;
        }
        .stripe {
            height:4px;
            background:linear-gradient(90deg,#FF6B35 0%,#FFB347 100%);
        }
        .body {
            padding:48px 44px 44px;
            text-align:center;
        }
        .check-wrap {
            width:80px; height:80px; border-radius:50%;
            background:linear-gradient(135deg,#FF6B35 0%,#E8501A 100%);
            display:flex; align-items:center; justify-content:center;
            margin:0 auto 28px;
            animation:pop 0.4s 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
        }
        @keyframes pop {
            from { opacity:0; transform:scale(0.5); }
            to   { opacity:1; transform:scale(1); }
        }
        h1 {
            font-family:'Playfair Display',Georgia,serif;
            font-size:28px; color:#1A1009;
            margin-bottom:14px; line-height:1.25;
        }
        .subtitle {
            font-size:15px; color:#7A6357;
            line-height:1.65; margin-bottom:36px;
        }
        .subtitle strong { color:#3D2B1F; }
        .hint {
            display:inline-flex; align-items:center; gap:8px;
            background:#FDF6EE; border:1px solid #F0E0D0;
            border-radius:100px; padding:10px 20px;
            font-size:13px; color:#9E8070; margin-bottom:28px;
        }
        .return-link {
            display:inline-block; font-size:14px; font-weight:500;
            color:#FF6B35; text-decoration:none;
            border-bottom:1px solid transparent; transition:border-color 0.2s;
        }
        .return-link:hover { border-color:#FF6B35; }
        .footer {
            background:#FDF6EE; padding:20px 44px;
            text-align:center; font-size:12px; color:#B0967E;
            border-top:1px solid #F0E6DC;
        }
    </style>
</head>
<body>
<div class="card">

    <div class="header">
        <img src="{{logoUrl}}" alt="Hungry Belly logo"/>
        <span class="logo-text">Hungry Belly</span>
    </div>

    <div class="stripe"></div>

    <div class="body">
        <div class="check-wrap">
            <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
                <polyline points="8,19 15,26 28,11" stroke="#FFFFFF" stroke-width="3.5"
                          stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <h1>You're all set,<br/>{{firstName}}!</h1>

        <p class="subtitle">
            Your <strong>Hungry Belly</strong> account has been activated.<br/>
            Head back to the app and start ordering.
        </p>

        <div class="hint">
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
                <circle cx="7.5" cy="7.5" r="6.5" stroke="#9E8070" stroke-width="1.2"/>
                <line x1="7.5" y1="5" x2="7.5" y2="8.5" stroke="#9E8070" stroke-width="1.3" stroke-linecap="round"/>
                <circle cx="7.5" cy="10.5" r="0.7" fill="#9E8070"/>
            </svg>
            You can safely close this tab now
        </div>

        <br/>
        <a href="{{appUrl}}" class="return-link">← Return to Hungry Belly</a>
    </div>

    <div class="footer">
        © 2026 Hungry Belly · Ho Chi Minh City, Vietnam
    </div>

</div>
</body>
</html>
